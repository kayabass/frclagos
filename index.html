  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>FRC Lagos — Join the waitlist<\u002Ftitle>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"390578ca-cb85-4c49-bc07-dbd3de2ca193\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Generated from Figma Variables. First mode = :root default.\n   FLOAT tokens are unitless — multiply by 1px in calc() where a length is needed. */\n\n:root {\n  --black: rgb(15,15,15); /* @kind color */\n  --white: rgb(255,255,255); /* @kind color */\n}\n<\u002Fstyle>\n<style>/* FRC — colour system. Two brand values only; everything else is a role alias. */\n:root{\n  --frc-black:rgb(15,15,15);\n  --frc-white:rgb(255,255,255);\n  /* Editing-only. Marks graphic/photo containers in the working file; never exported. */\n  --frc-placeholder-stroke:rgb(151,71,255);\n  /* Neutral paper tone found on one guideline surface. */\n  --frc-bone:rgb(234,230,222);\n\n  /* Roles — dark ground (the default) */\n  --surface-primary:var(--frc-black);\n  --text-primary:var(--frc-white);\n  --stroke-primary:var(--frc-white);\n\n  /* Roles — light ground (photo-on-light / black-text templates) */\n  --surface-inverse:var(--frc-white);\n  --text-inverse:var(--frc-black);\n  --stroke-inverse:var(--frc-black);\n\n  --link-color:var(--frc-white);\n  --link-color-hover:var(--frc-white);\n}\n<\u002Fstyle>\n<style>/* khmer */\n@font-face {\n  font-family: 'Koulen';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4bd7716b-784f-4faf-9b24-54934e19a83e\") format('woff2');\n  unicode-range: U+1780-17FF, U+19E0-19FF, U+200C-200D, U+25CC;\n}\n/* latin */\n@font-face {\n  font-family: 'Koulen';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"08b986b8-8e17-4461-9aa7-f8d1462aff35\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6 aitlist\" style=\"width:100%;max-width:1280px;margin:0 auto;background:rgb(15,15,15);color:rgb(255,255,255);font-family:var(--font-text);font-size:24px;line-height:24px;letter-spacing:0.01em\">\n\n<div style=\"position:relative;height:860px;overflow:hidden\">\n<div style=\"position:absolute;inset:0;filter:grayscale(1) brightness(0.55)\"><image-slot id=\"a-hero\" shape=\"rect\" src=\"b8a4d250-464d-4388-a999-51fd775c4684\" placeholder=\"Drop a Lagos landmark photo\"><\u002Fimage-slot><\u002Fdiv>\n<div style=\"position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none\">\n<x-import component-from-global-scope=\"FRCLagosDesignSystem_7fc82f.IdentificationModule\" type=\"global\" variant=\"newChapter\" chapter-text=\"LOS | NG\" hint-size=\"100%,130px\"><\u002Fx-import>\n<div style=\"flex-grow:1\"><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:40px;padding:0 clamp(24px,5vw,64px) 64px clamp(24px,5vw,64px)\">\n<div style=\"font-family:Koulen,sans-serif;font-size:clamp(64px,13vw,168px);line-height:0.84em;letter-spacing:0.01em\">FOUNDERS<br>RUNNING CLUB<br>LAGOS<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:24px;align-items:flex-start;pointer-events:auto\">\n<span>A NEW CHAPTER IS COMING TO LAGOS.<br>JOIN THE WAITLIST FOR THE FIRST RUN.<\u002Fspan>\n<a href=\"#waitlist-a\" style=\"display:inline-flex;align-items:center;height:64px;padding:0 32px;background:rgb(255,255,255);color:rgb(15,15,15);box-shadow:inset 0 0 0 3px rgb(255,255,255);text-decoration:none;font-family:Koulen,sans-serif;font-size:32px;line-height:32px\" style-hover=\"background:rgb(15,15,15);color:rgb(255,255,255)\">JOIN THE WAITLIST<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:64px;padding:clamp(64px,9vw,120px) clamp(24px,5vw,64px);border-bottom:1.5px solid rgb(255,255,255)\">\n<div style=\"font-family:Koulen,sans-serif;font-size:80px;line-height:68px\">WHAT FRC IS<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:24px;text-wrap:pretty;max-width:520px\">\n<p style=\"margin:0\">Founders Running Club is a global running club for founders, operators and investors. Each city runs as a chapter with its own weekly run and its own account.<\u002Fp>\n<p style=\"margin:0\">The Lagos chapter brings the club to Nigeria. Runs start early, stay conversational and end with coffee.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));border-bottom:1.5px solid rgb(255,255,255)\">\n<div style=\"display:flex;flex-direction:column;padding:120px 0 120px 0;border-bottom:1.5px solid rgb(255,255,255)\">\n<div style=\"font-family:Koulen,sans-serif;font-size:80px;line-height:68px;padding:0 64px 34px 64px\">FIRST RUN<\u002Fdiv>\n<x-import component-from-global-scope=\"FRCLagosDesignSystem_7fc82f.Additional\" variant=\"oneField\" fields=\"{{ firstWhen }}\" hint-size=\"100%,77px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"FRCLagosDesignSystem_7fc82f.Where\" place=\"TO BE ANNOUNCED\" hint-size=\"100%,62px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"FRCLagosDesignSystem_7fc82f.Description\" text=\"The date and meeting point go to the waitlist first.\" hint-size=\"100%,80px\"><\u002Fx-import>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;padding:120px 0 120px 0\">\n<div style=\"font-family:Koulen,sans-serif;font-size:80px;line-height:68px;padding:0 64px 34px 64px\">HOW RUNS WORK<\u002Fdiv>\n<x-import component-from-global-scope=\"FRCLagosDesignSystem_7fc82f.Distance\" distance=\"5\" unit=\"KM\" hint-size=\"100%,45px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"FRCLagosDesignSystem_7fc82f.Pace\" pace=\"06:30\" unit=\"/ KM\" hint-size=\"100%,45px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"FRCLagosDesignSystem_7fc82f.Addi :auto;max-width:90%;object-fit:contain;mix-blend-mode:lighten\"><\u002Fdiv>\n<div style=\"height:200px;box-shadow:inset 0 0 0 1.5px rgb(255,255,255);display:flex;align-items:center;justify-content:center;overflow:hidden\"><img src=\"46aa4829-fa8e-4d05-8ee1-20d3481676ed\" alt=\"NXT Build\" style=\"height:130px;width:auto;max-width:90%;object-fit:contain;mix-blend-mode:lighten\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:64px;padding:clamp(64px,9vw,120px) clamp(24px,5vw,64px)\">\n<div style=\"font-family:Koulen,sans-serif;font-size:80px;line-height:68px\">FAQ<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;border-top:1.5px solid rgb(255,255,255)\">\n<sc-for list=\"{{ faqA }}\" as=\"q\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;flex-direction:column;border-bottom:1.5px solid rgb(255,255,255)\">\n<button sc-camel-on-click=\"{{ q.toggle }}\" style=\"all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:24px 0;font-weight:700\">\n<span>{{ q.q }}<\u002Fspan><span style=\"font-family:Koulen,sans-serif;font-size:32px;line-height:24px\">{{ q.sign }}<\u002Fspan>\n<\u002Fbutton>\n<sc-if value=\"{{ q.open }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;padding:0 0 24px 0;max-width:640px;text-wrap:pretty\">{{ q.a }}<\u002Fp><\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"waitlist-a\" style=\"position:relative;overflow:hidden\">\n<div style=\"position:absolute;inset:0;filter:grayscale(1) brightness(0.4)\"><image-slot id=\"a-form-bg\" shape=\"rect\" src=\"7231ff4b-f91d-44d8-8f0e-b203262afb41\" placeholder=\"Drop a Lagos street photo\"><\u002Fimage-slot><\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:64px;padding:clamp(64px,9vw,120px) clamp(24px,5vw,64px);pointer-events:none\">\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"font-family:Koulen,sans-serif;font-size:clamp(64px,9vw,120px);line-height:0.84em\">JOIN THE<br>WAITLIST<\u002Fdiv>\n<span>BE FIRST TO HEAR ABOUT THE FIRST RUN.<\u002Fspan>\n<\u002Fdiv>\n<div style=\"pointer-events:auto\">\n<sc-if value=\"{{ aNotDone }}\" hint-placeholder-val=\"{{ true }}\">\n<form sc-camel-on-submit=\"{{ submitA }}\" style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ fieldsA }}\" as=\"f\" hint-placeholder-count=\"7\">\n<label style=\"display:grid;grid-template-columns:150px minmax(0,1fr);align-items:end;padding:12px 0\">\n<span style=\"font-weight:700\">{{ f.label }}<\u002Fspan>\n<sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n<sc-raw-select name=\"{{ f.key }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ changeA }}\" style=\"appearance:none;background:transparent;color:inherit;border:0;border-radius:0;border-bottom:1.5px solid currentColor;font:inherit;padding:0 0 8px 0;outline:none;cursor:pointer\">\n<sc-for list=\"{{ f.options }}\" as=\"o\"><option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption><\u002Fsc-for>\n<\u002Fsc-raw-select>\n<\u002Fsc-if>\n<sc-if value=\"{{ f.isInput }}\" hint-placeholder-val=\"{{ true }}\">\n<input name=\"{{ f.key }}\" type=\"{{ f.type }}\" value=\"{{ f.value }}\" placeholder=\"{{ f.ph }}\" sc-camel-on-change=\"{{ changeA }}\" style=\"background:transparent;color:inherit;border:0;border-radius:0;border-bottom:1.5px solid currentColor;font:inherit;padding:0 0 8px 0;outline:none;min-width:0\" style-focus=\"border-bottom:3px solid currentColor;padding-bottom:6.5px\">\n<\u002Fsc-if>\n<\u002Flabel>\n<\u002Fsc-for>\n<sc-if value=\"{{ a.error }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-weight:700;padding-top:8px\">{{ a.error }}<\u002Fspan><\u002Fsc-if>\n<button type=\"submit\" style=\"margin-top:32px;height:64px;background:rgb(255,255,255);color:rgb(15,15,15);border:0;border-radius:0;box-shadow:inset 0 0 0 3px rgb(255,255,255);cursor:pointer;font-family:Koulen,sans-serif;font-size:32px;line-height:32px\" style-hover=\"background:rgb(15,15,15);color:rgb(255,255,255)\">JOIN THE WAITLIST<\u002Fbutton>\n<\u002Fform>\n<\u002Fsc-if>\n<sc-if value=\"{{ a.submitted }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:flex;flex-direction:column;gap:24px;padding:48px 0\">\n<div style=\"font-family:Koulen,sans-serif;font-size:80px;line-height:68px\">YOU ARE ON<br>THE LIST<\u002Fdiv>\n<span>THANKS, {{ a.firstName }}. THE FIRST RUN DETAILS WILL REACH YOU BY EMAIL AND WHATSAPP.<\u002Fspan>\n<a href=\"https://instagram.com/frclagos\" target=\"_blank\" style=\"display:inline-flex;align-self:flex-start;align-items:center;height:64px;padding:0 32px;box-shadow:inset 0 0 0 3px rgb(255,255,255);text-decoration:none;font-family:Koulen,sans-serif;font-size:32px;line-height:32px\" style-hover=\"background:rgb(255,255,255);color:rgb(15,15,15)\">FOLLOW @FRCLAGOS<\u002Fa>\n<button sc-camel-on-click=\"{{ resetA }}\" style=\"all:unset;cursor:pointer;align-self:flex-start;text-decoration:underline\">Sign up someone else<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:40px;padding:64px clamp(24px,5vw,64px)\">\n<img src=\"64a1cf4d-ea88-47e5-bf44-66c2914cf290\" alt=\"FRC Lagos\" style=\"height:96px;width:auto\">\n<span>KEEP MOVING!<\u002Fspan>\n<a href=\"https://instagram.com/frclagos\" target=\"_blank\" style=\"font-weight:700\">Instagram: @FRCLAGOS<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst FIELDS = [\n  { key: \"name\", label: \"Name:\", type: \"text\", ph: \"Full name\" },\n  { key: \"email\", label: \"Email:\", type: \"email\", ph: \"name@company.com\" },\n  { key: \"phone\", label: \"Phone:\", type: \"tel\", ph: \"WhatsApp number\" },\n  { key: \"instagram\", label: \"Instagram:\", type: \"text\", ph: \"@handle\" },\n  { key: \"company\", label: \"Company:\", type: \"text\", ph: \"Company or startup\" },\n  { key: \"role\", label: \"Role:\", select: [\"Select role\", \"Founder\", \"Investor\", \"Operator\", \"Other\"] },\n  { key: \"area\", label: \"Area:\", select: [\"Select neighbourhood\", \"Ikoyi\", \"Victoria Island\", \"Lekki\", \"Ajah\", \"Yaba\", \"Surulere\", \"Ikeja\", \"Gbagada\", \"Other\"] },\n];\nconst blank = () => ({ values: {}, submitted: false, error: \"\" });\n\nclass Component extends DCLogic {\n  state = { a: blank(), b: blank(), faqOpen: { a: 0, b: 0 } };\n\n  change(k, e) {\n    const { name, value } = e.target;\n    this.setState(s => ({ [k]: { ...s[k], error: \"\", values: { ...s[k].values, [name]: value } } }));\n  }\n  submit(k, e) {\n    e.preventDefault();\n    const v = this.state[k].values;\n    let error = \"\";\n    if (!(v.name || \"\").trim()) error = \"Add your name to join.\";\n    else if (!/^\\S+@\\S+\\.\\S+$/.test(v.email || \"\")) error = \"Add a valid email address.\";\n    this.setState(s => ({ [k]: { ...s[k], error, submitted: !error } }));\n  }\n  fields(k) {\n    const vals = this.state[k].values;\n    return FIELDS.map(f => ({\n      ...f, value: vals[f.key] ?? \"\", isSelect: !!f.select, isInput: !f.select,\n      options: (f.select || []).map((t, i) => ({ t, v: i === 0 ? \"\" : t })),\n    }));\n  }\n  faq(k) {\n    const items = [\n      [\"Who can join?\", \"Founders, operators and investors who live or work in Lagos.\"],\n      [\"Does it cost anything?\", \"No. Chapter runs are free.\"],\n      [\"What pace are the runs?\", \"Groups run at a conversational pace. Every pace is welcome.\"],\n      [\"When is the first run?\", \"The date and meeting point go to the waitlist first, then to Instagram.\"],\n    ];\n    const openIdx = this.state.faqOpen[k];\n    return items.map(([q, a], i) => ({\n      q, a, open: openIdx === i, sign: openIdx === i ? \"–\" : \"+\",\n      toggle: () => this.setState(s => ({ faqOpen: { ...s.faqOpen, [k]: s.faqOpen[k] === i ? -1 : i } })),\n    }));\n  }\n  view(k) {\n    const st = this.state[k];\n    return { ...st, firstName: ((st.values.name || \"\").trim().split(\" \")[0] || \"\").toUpperCase() };\n  }\n  renderVals() {\n    return {\n      a: this.view(\"a\"), b: this.view(\"b\"),\n      aNotDone: !this.state.a.submitted, bNotDone: !this.state.b.submitted,\n      fieldsA: this.fields(\"a\"), fieldsB: this.fields(\"b\"),\n      changeA: e => this.change(\"a\", e), changeB: e => this.change(\"b\", e),\n      submitA: e => this.submit(\"a\", e), submitB: e => this.submit(\"b\", e),\n      resetA: () => this.setState({ a: blank() }), resetB: () => this.setState({ b: blank() }),\n      faqA: this.faq(\"a\"), faqB: this.faq(\"b\"),\n      firstWhen: [{ label: \"When:\", value: \"TO BE ANNOUNCED\" }],\n      runType: [{ label: \"Run type:\", value: \"OPEN\" }],\n      chapters: [\n        { code: \"SFO | US\", city: \"SAN FRANCISCO\" }, { code: \"NYC | US\", city: \"NEW YORK\" },\n        { code: \"LDN | UK\", city: \"LONDON\" }, { code: \"BER | DE\", city: \"BERLIN\" },\n        { code: \"DXB | AE\", city: \"DUBAI\" }, { code: \"SIN | SG\", city: \"SINGAPORE\" },\n        { code: \"NBO | KE\", city: \"NAIROBI\" }, { code: \"LOS | NG\", city: \"LAGOS\" },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
